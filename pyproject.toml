[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthoracle"
version = "0.1.0"
description = "Synthetic oracle benchmark for evaluating scientific reasoning in optimization agents"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
    "mypy>=1.8",
]
bo = [
    "botorch>=0.12",
    "gpytorch>=1.12",
    "torch>=2.2,<2.3",
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running experiments (deselected by default)"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/test_bo_baseline.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["botorch.*", "gpytorch.*", "torch.*"]
ignore_missing_imports = true
